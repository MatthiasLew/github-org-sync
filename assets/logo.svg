<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bluePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="greenTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  
  <!-- Outer Sync Loop -->
  <path d="M 256,60 A 196,196 0 0,1 420,180" fill="none" stroke="url(#bluePurple)" stroke-width="24" stroke-linecap="round" />
  <path d="M 420,180 L 440,140 M 420,180 L 380,170" fill="none" stroke="url(#bluePurple)" stroke-width="20" stroke-linecap="round" />
  
  <path d="M 256,452 A 196,196 0 0,1 92,332" fill="none" stroke="url(#bluePurple)" stroke-width="24" stroke-linecap="round" />
  <path d="M 92,332 L 72,372 M 92,332 L 132,342" fill="none" stroke="url(#bluePurple)" stroke-width="20" stroke-linecap="round" />

  <!-- Inner Git Branch Diagram -->
  <!-- Main vertical line -->
  <path d="M 210,120 L 210,392" fill="none" stroke="#e2e8f0" stroke-width="20" stroke-linecap="round" />
  
  <!-- Nodes on Main line -->
  <circle cx="210" cy="160" r="22" fill="url(#greenTeal)" stroke="#e2e8f0" stroke-width="6" />
  <circle cx="210" cy="350" r="22" fill="url(#greenTeal)" stroke="#e2e8f0" stroke-width="6" />
  
  <!-- Side Branch line -->
  <path d="M 210,200 C 310,230 310,280 210,310" fill="none" stroke="url(#greenTeal)" stroke-width="16" stroke-linecap="round" />
  
  <!-- Node on Side branch -->
  <circle cx="280" cy="256" r="18" fill="url(#bluePurple)" stroke="#e2e8f0" stroke-width="6" />
</svg>
