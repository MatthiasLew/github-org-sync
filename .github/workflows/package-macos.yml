name: Package macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-macos:
    name: Build & Smoke Test macOS Binary
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Compile macOS Binary
        run: |
          pyinstaller github-org-sync.spec

      - name: Verify compiled binary exists
        run: |
          if [ ! -f "dist/github-org-sync/github-org-sync" ]; then
            echo "Compiled binary not found in dist/github-org-sync/"
            exit 1
          fi

      - name: Run Smoke Test on Compiled Binary
        run: |
          dist/github-org-sync/github-org-sync --smoke-test

      - name: Package Binary to Zip
        run: |
          cd dist
          zip -r github-org-sync-macos-x64.zip github-org-sync

      - name: Generate Checksum Hash
        run: |
          shasum -a 256 dist/github-org-sync-macos-x64.zip | cut -d ' ' -f 1 > dist/github-org-sync-macos-x64.zip.sha256

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-org-sync-macos-x64
          path: |
            dist/github-org-sync-macos-x64.zip
            dist/github-org-sync-macos-x64.zip.sha256
