name: Git Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  git-test:
    name: Git Integration on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Configure Git identity
        run: |
          git config --global user.name "CI Runner"
          git config --global user.email "ci@runner.com"
          git config --global init.defaultBranch main

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install Qt requirements (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libxi6 \
            libxcb-cursor0

      - name: Run Git Integration Tests (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: |
          pytest -m git

      - name: Run Git Integration Tests (Linux with Xvfb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          xvfb-run pytest -m git
