name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check version consistency
        run: |
          python -c "
          import tomllib, sys
          from pathlib import Path
          tag = '${{ github.ref_name }}'.lstrip('v')
          pyproject = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          pkg_ver = pyproject['project']['version']
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          expected_heading = f'## [{pkg_ver}]'
          if tag != pkg_ver:
              print(f'ERROR: Tag version v{tag} does not match pyproject.toml version {pkg_ver}', file=sys.stderr)
              sys.exit(1)
          if expected_heading not in changelog:
              print(f'ERROR: CHANGELOG.md missing heading for {expected_heading}', file=sys.stderr)
              sys.exit(1)
          print(f'Version validation passed: tag={tag}, pyproject={pkg_ver}, changelog={expected_heading}')
          "

  release-quality-gate:
    name: Release Quality & Coverage Gate
    runs-on: ubuntu-latest
    needs: [validate-version]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Check Ruff Formatting
        run: |
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy src

      - name: Run Tests with Branch Coverage
        run: |
          pytest -m "not gui and not slow" --cov=src/github_org_sync --cov-branch --cov-report=term-missing --cov-report=json:coverage.json tests

      - name: Verify Core Branch Coverage Gate
        run: |
          python scripts/verify_core_coverage.py --min-branch-coverage 90.0 --min-line-coverage 90.0

      - name: Verify CLI Help & Version
        run: |
          python -m github_org_sync.cli --help
          python -m github_org_sync.cli --version

      - name: Wheel Package Smoke Test
        run: |
          python scripts/test_installed_package.py

  release-windows:
    name: Build Windows Release Asset
    runs-on: windows-latest
    needs: [validate-version, release-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Compile Windows EXE
        run: |
          pyinstaller github-org-sync.spec

      - name: Run Smoke Test on Compiled EXE
        run: |
          dist/github-org-sync/github-org-sync.exe --smoke-test

      - name: Package EXE to ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist/github-org-sync -DestinationPath "dist/github-org-sync-$version-windows-x64.zip" -Force

      - name: Generate Checksum Hash
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $hash = (Get-FileHash "dist/github-org-sync-$version-windows-x64.zip" -Algorithm SHA256).Hash
          echo "$hash  github-org-sync-$version-windows-x64.zip" > "dist/github-org-sync-$version-windows-x64.zip.sha256"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-windows
          path: |
            dist/github-org-sync-*-windows-x64.zip
            dist/github-org-sync-*-windows-x64.zip.sha256

  release-linux:
    name: Build Linux Release Asset
    runs-on: ubuntu-latest
    needs: [validate-version, release-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Install Qt requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libxi6 \
            libxcb-cursor0

      - name: Compile Linux Binary
        run: |
          pyinstaller github-org-sync.spec

      - name: Run Smoke Test on Compiled Binary
        run: |
          xvfb-run dist/github-org-sync/github-org-sync --smoke-test

      - name: Package Tarball
        run: |
          VERSION="${{ github.ref_name }}"
          tar -czf dist/github-org-sync-$VERSION-linux-x64.tar.gz -C dist github-org-sync

      - name: Generate Checksum Hash
        run: |
          VERSION="${{ github.ref_name }}"
          sha256sum dist/github-org-sync-$VERSION-linux-x64.tar.gz | cut -d ' ' -f 1 > dist/github-org-sync-$VERSION-linux-x64.tar.gz.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-linux
          path: |
            dist/github-org-sync-*-linux-x64.tar.gz
            dist/github-org-sync-*-linux-x64.tar.gz.sha256

  release-macos:
    name: Build macOS Release Asset
    runs-on: macos-latest
    needs: [validate-version, release-quality-gate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Compile macOS Binary
        run: |
          pyinstaller github-org-sync.spec

      - name: Run Smoke Test on Compiled Binary
        run: |
          dist/github-org-sync/github-org-sync --smoke-test

      - name: Package Zip
        run: |
          VERSION="${{ github.ref_name }}"
          cd dist
          zip -r github-org-sync-$VERSION-macos-x64.zip github-org-sync

      - name: Generate Checksum Hash
        run: |
          VERSION="${{ github.ref_name }}"
          shasum -a 256 dist/github-org-sync-$VERSION-macos-x64.zip | cut -d ' ' -f 1 > dist/github-org-sync-$VERSION-macos-x64.zip.sha256

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-macos
          path: |
            dist/github-org-sync-*-macos-x64.zip
            dist/github-org-sync-*-macos-x64.zip.sha256

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-windows, release-linux, release-macos]

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: release-asset-*
          merge-multiple: true

      - name: Verify downloaded assets
        run: |
          ls -la dist-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          name: GitHub Organization Sync ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
