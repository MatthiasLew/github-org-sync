name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows Release Asset
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Compile Windows EXE
        run: |
          pyinstaller github-org-sync.spec

      - name: Run Smoke Test on Compiled EXE
        run: |
          dist/github-org-sync/github-org-sync.exe --smoke-test

      - name: Package EXE to ZIP
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          Compress-Archive -Path dist/github-org-sync -DestinationPath "dist/github-org-sync-$version-windows-x64.zip" -Force

      - name: Generate Checksum Hash
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $hash = (Get-FileHash "dist/github-org-sync-$version-windows-x64.zip" -Algorithm SHA256).Hash
          echo "$hash  github-org-sync-$version-windows-x64.zip" > "dist/github-org-sync-$version-windows-x64.zip.sha256"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-windows
          path: |
            dist/github-org-sync-*-windows-x64.zip
            dist/github-org-sync-*-windows-x64.zip.sha256

  release-linux:
    name: Build Linux Release Asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Install Qt requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libxi6 \
            libxcb-cursor0

      - name: Compile Linux Binary
        run: |
          pyinstaller github-org-sync.spec

      - name: Run Smoke Test on Compiled Binary
        run: |
          xvfb-run dist/github-org-sync/github-org-sync --smoke-test

      - name: Package Tarball
        run: |
          VERSION="${{ github.ref_name }}"
          tar -czf dist/github-org-sync-$VERSION-linux-x64.tar.gz -C dist github-org-sync

      - name: Generate Checksum Hash
        run: |
          VERSION="${{ github.ref_name }}"
          sha256sum dist/github-org-sync-$VERSION-linux-x64.tar.gz | cut -d ' ' -f 1 > dist/github-org-sync-$VERSION-linux-x64.tar.gz.sha256

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-linux
          path: |
            dist/github-org-sync-*-linux-x64.tar.gz
            dist/github-org-sync-*-linux-x64.tar.gz.sha256

  release-macos:
    name: Build macOS Release Asset
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Compile macOS Binary
        run: |
          pyinstaller github-org-sync.spec

      - name: Run Smoke Test on Compiled Binary
        run: |
          dist/github-org-sync/github-org-sync --smoke-test

      - name: Package Zip
        run: |
          VERSION="${{ github.ref_name }}"
          cd dist
          zip -r github-org-sync-$VERSION-macos-x64.zip github-org-sync

      - name: Generate Checksum Hash
        run: |
          VERSION="${{ github.ref_name }}"
          shasum -a 256 dist/github-org-sync-$VERSION-macos-x64.zip | cut -d ' ' -f 1 > dist/github-org-sync-$VERSION-macos-x64.zip.sha256

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-macos
          path: |
            dist/github-org-sync-*-macos-x64.zip
            dist/github-org-sync-*-macos-x64.zip.sha256

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [release-windows, release-linux, release-macos]

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          pattern: release-asset-*
          merge-multiple: true

      - name: Verify downloaded assets
        run: |
          ls -la dist-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/*
          name: GitHub Organization Sync ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
