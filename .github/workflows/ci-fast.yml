name: Fast CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  fast-checks:
    name: Lint, Type Check, Unit Tests & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run Ruff Lint
        run: |
          ruff check .

      - name: Check Ruff Formatting
        run: |
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy src

      - name: Install Qt requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libxi6 \
            libxcb-cursor0

      - name: Run Fast Unit Tests
        run: |
          pytest -m unit

      - name: Verify CLI Help & Version
        run: |
          python -m github_org_sync --help
          python -m github_org_sync --version

      - name: Headless GUI Smoke Test
        run: |
          xvfb-run python -m github_org_sync --smoke-test
