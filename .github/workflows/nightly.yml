name: Nightly Audits & Docker Matrix

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight UTC
  workflow_dispatch:      # Allows manual trigger

jobs:
  slow-tests:
    name: Run Slow & Network Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Install Qt requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libglib2.0-0 libdbus-1-3 libfontconfig1 libxrender1 libxi6 libxcb-cursor0

      - name: Run Slow Tests
        run: |
          xvfb-run pytest -m slow

  docker-matrix:
    name: Docker Matrix (${{ matrix.base-image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base-image: ["ubuntu:24.04", "debian:12-slim", "python:3.11-slim"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            --build-arg BASE_IMAGE=${{ matrix.base-image }} \
            -t github-org-sync-test:${{ strategy.job-index }} \
            -f audit/docker/Dockerfile .

      - name: Run Docker Tests
        run: |
          docker run --rm github-org-sync-test:${{ strategy.job-index }}
