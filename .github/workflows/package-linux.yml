name: Package Linux

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Build & Smoke Test Linux Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
          python -m pip install pyinstaller

      - name: Install Qt requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libxi6 \
            libxcb-cursor0

      - name: Compile Linux Binary
        run: |
          pyinstaller github-org-sync.spec

      - name: Verify compiled binary exists
        run: |
          if [ ! -f "dist/github-org-sync/github-org-sync" ]; then
            echo "Compiled binary not found in dist/github-org-sync/"
            exit 1
          fi

      - name: Run Smoke Test on Compiled Binary
        run: |
          xvfb-run dist/github-org-sync/github-org-sync --smoke-test

      - name: Package Binary to Tarball
        run: |
          tar -czf dist/github-org-sync-linux-x64.tar.gz -C dist github-org-sync

      - name: Generate Checksum Hash
        run: |
          sha256sum dist/github-org-sync-linux-x64.tar.gz | cut -d ' ' -f 1 > dist/github-org-sync-linux-x64.tar.gz.sha256

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-org-sync-linux-x64
          path: |
            dist/github-org-sync-linux-x64.tar.gz
            dist/github-org-sync-linux-x64.tar.gz.sha256
